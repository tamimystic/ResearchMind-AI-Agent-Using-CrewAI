[project]
name = "researchmind"
version = "0.1.0"
description = "researchmind using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.4",
    "groq>=1.2.0",
    "litellm>=1.83.0",
    "ollama>=0.6.2",
    "openai>=2.36.0",
    "python-dotenv>=1.2.2",
    "together>=2.12.0",
]

[project.scripts]
researchmind = "researchmind.main:run"
run_crew = "researchmind.main:run"
train = "researchmind.main:train"
replay = "researchmind.main:replay"
test = "researchmind.main:test"
run_with_trigger = "researchmind.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
