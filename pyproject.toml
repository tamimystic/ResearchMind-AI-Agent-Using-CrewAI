[project]
name = "researchmind"
version = "0.1.0"
description = "researchmind using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.4"
]

[project.scripts]
researchmind = "researchmind.main:run"
run_crew = "researchmind.main:run"
train = "researchmind.main:train"
replay = "researchmind.main:replay"
test = "researchmind.main:test"
run_with_trigger = "researchmind.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
