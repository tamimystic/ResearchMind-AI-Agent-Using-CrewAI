summary_task:
  description: >
    Summarize the topic: {research_topic}

    Include:
    - Research objective
    - Proposed solution
    - Key contribution
    - Real-world importance

    Keep response under 150 words.

  expected_output: >
    Short structured summary.

  agent: summary_agent


methodology_task:
  description: >
    Explain the methodology of:
    {research_topic}

    Include:
    - Dataset
    - Preprocessing
    - Model architecture
    - Training process
    - Evaluation

    Keep response under 200 words.

  expected_output: >
    Step-by-step methodology explanation.

  agent: methodology_agent


math_task:
  description: >
    Explain mathematical concepts related to:
    {research_topic}

    Include:
    - Loss function
    - Optimization
    - Important formulas
    - Beginner explanation

    Keep response under 200 words.

  expected_output: >
    Mathematical explanation.

  agent: math_agent


limitation_task:
  description: >
    Analyze possible limitations of:
    {research_topic}

    Include:
    - Dataset limitations
    - Overfitting risks
    - Scalability
    - Weaknesses
    - Future improvements

    Keep response under 150 words.

  expected_output: >
    Research limitations.

  agent: limitation_agent


related_papers_task:
  description: >
    Suggest 5 related papers for:
    {research_topic}

    Explain briefly:
    - Why relevant
    - Main similarity

    Keep response concise.

  expected_output: >
    Related research recommendations.

  agent: related_papers_agent


implementation_task:
  description: >
    Create an implementation roadmap for:
    {research_topic}

    Include:
    - Dataset preparation
    - Preprocessing
    - Model building
    - Training
    - Evaluation

    Keep response under 200 words.

  expected_output: >
    Practical implementation roadmap.

  agent: implementation_agent


code_generation_task:
  description: >
    Generate a TensorFlow/Keras implementation blueprint for:
    {research_topic}

    Include:
    - Model structure
    - Training pipeline
    - Evaluation

    Keep code concise.

  expected_output: >
    Clean implementation template.

  agent: code_agent


quiz_task:
  description: >
    Create learning questions for:
    {research_topic}

    Generate:
    - 5 MCQ
    - 3 short questions
    - 3 viva questions

    Keep concise.

  expected_output: >
    Quiz materials.

  agent: quiz_agent


report_generation_task:
  description: >
    Combine all previous outputs into a final report.

    Keep concise and readable.

  expected_output: >
    Final research report.

  agent: report_agent